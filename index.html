<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <!-- Cột trái: inputs -->
    <div class="left-col">

      <h1>QR Generator</h1>

      <!-- Cài đặt kích thước -->
      <div class="settings-bar">
        <label for="cell-size">Kích thước:</label>
        <input type="range" id="cell-size" min="0.5" max="5" step="0.5" value="2" />
        <span id="cell-size-display"></span>
      </div>

      <!-- Sinh từ Regex -->
      <section class="card">
        <h2>Sinh từ Regex</h2>
        <div id="regex-rows"></div>
      </section>

      <!-- Sinh từ Text -->
      <section class="card">
        <h2>Sinh từ Text</h2>
        <div class="text-controls">
          <input type="text" id="text-input" placeholder="Nhập chuỗi, vd: TSR260001649" />
          <label class="auto-incr-label">
            <input type="checkbox" id="auto-incr" />
            Tăng dần
          </label>
          <button class="btn btn--primary" id="gen-text">Sinh QR</button>
        </div>
      </section>

      <!-- Lịch sử QR -->
      <section class="card">
        <div class="log-header">
          <h2>Lịch sử</h2>
          <button class="btn btn--danger btn--sm" id="log-clear" style="display:none">Xóa tất cả</button>
        </div>
        <div id="log-filters" class="log-filters"></div>
        <p id="log-empty" class="log-empty">Chưa có QR nào được sinh.</p>
        <div id="log-list"></div>
      </section>

    </div>

    <!-- Cột phải: QR chung -->
    <div class="right-col">
      <div class="qr-display card">
        <h2>Kết quả</h2>
        <canvas id="qr-canvas" style="display:none"></canvas>
        <div class="qr-text-row">
          <p id="qr-text" class="qr-text"></p>
          <button class="btn btn--secondary btn--sm" id="copy-btn" style="display:none" title="Copy text">Copy</button>
        </div>
        <button class="btn btn--secondary" id="download-btn" style="display:none">Tải PNG</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
